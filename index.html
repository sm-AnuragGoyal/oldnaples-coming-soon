<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Old Naples · Coming soon</title>
  <meta name="description" content="Old Naples is coming soon.">
  <meta name="robots" content="noindex">
  <meta property="og:title" content="Old Naples · Coming soon">
  <meta property="og:description" content="Something new is on its way.">
  <meta name="theme-color" content="#f4efe6">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23f4efe6'/%3E%3Ctext x='32' y='44' font-family='Georgia,serif' font-size='34' text-anchor='middle' fill='%239a3b26'%3EON%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f4efe6;
      --ink: #2a2420;
      --muted: #7a6e64;
      --accent: #9a3b26;
      --rule: #d9cfc1;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1c1916;
        --ink: #f1ebe2;
        --muted: #a89c90;
        --accent: #e08a6c;
        --rule: #3a332d;
      }
    }
    * { box-sizing: border-box; margin: 0; }
    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
      display: grid;
      place-items: center;
      padding: 32px 20px;
      -webkit-font-smoothing: antialiased;
    }
    main {
      text-align: center;
      max-width: 560px;
      animation: rise 900ms cubic-bezier(.2,.7,.2,1) both;
    }
    .eyebrow {
      font-size: 12px;
      letter-spacing: .32em;
      text-transform: uppercase;
      color: var(--muted);
    }
    h1 {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-weight: 500;
      font-size: clamp(56px, 14vw, 112px);
      line-height: .95;
      letter-spacing: -.01em;
      margin: 20px 0 24px;
    }
    h1 em { font-style: italic; color: var(--accent); }
    .rule {
      width: 64px;
      height: 1px;
      background: var(--rule);
      margin: 0 auto 24px;
    }
    p {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-style: italic;
      font-size: clamp(20px, 4.5vw, 26px);
      color: var(--muted);
    }
    footer {
      position: fixed;
      bottom: 20px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 12px;
      letter-spacing: .08em;
      color: var(--muted);
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: none; }
    }
    @media (prefers-reduced-motion: reduce) { main { animation: none; } }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">Coming soon</div>
    <h1>Old <em>Naples</em></h1>
    <div class="rule"></div>
    <p>Something new is on its way.</p>
  </main>
  <footer>oldnaples.in</footer>
</body>
</html>
